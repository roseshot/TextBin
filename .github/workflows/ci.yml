name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Verify Worker bundle
        run: bunx wrangler deploy --dry-run

      - name: Worker integration smoke test
        shell: bash
        run: |
          bunx wrangler dev --local --ip 127.0.0.1 --port 8787 --var TTL_SECONDS:2 > /tmp/textbin-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/textbin-worker.log; exit 1; fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/ -H 'content-type: application/json' -d '{"smoke":"working"}')
          test "$status" = 204
          curl -fsS http://127.0.0.1:8787/ | grep -q 'working'
          sleep 3
          curl -fsS http://127.0.0.1:8787/ | grep -q 'No data available.'

